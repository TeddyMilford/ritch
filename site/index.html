<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ritch</title>
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ritch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111;
      --muted: #666;
      --line: #e5e5e5;
      --blue: #0b2a6f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #888; --line: #2a2a2a; --blue: #6d8fdc; }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    }
    p { margin: 0; }
    b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .head { display: flex; justify-content: space-between; }

    .grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; margin: min(1.5cm, 4dvh) 0 0; }
    .c {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1; border-radius: 2px; border: 1px solid var(--line);
      font-size: 9px; font-weight: 700; line-height: 1; font-style: normal; letter-spacing: -0.03em;
    }
    .c.done { color: var(--blue); }
    .c.done::after { content: '33'; }
    .c.miss { background: var(--line); }
    .c.today { border: 1.5px dashed var(--fg); }
    .c[data-day] { cursor: pointer; }
    .c.view { outline: 2px solid var(--blue); outline-offset: 1px; }

    /* Totals so far, under the grid */
    .goals { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; text-align: center; font-size: 13px; line-height: 1.3; }
    .goals b { display: block; font-size: 20px; color: var(--blue); }

    /* Today's list. Tap a row to tick it. */
    .now { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 0; padding-top: 12px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      min-height: 52px; padding: 8px 14px; border-color: var(--line);
    }
    .item .box {
      flex: none; width: 26px; height: 26px; border: 1.5px solid var(--fg); border-radius: 4px;
      display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
    }
    .item.on .box { background: var(--fg); color: var(--bg); }
    .item.on .box::after { content: '✓'; }
    .item.on .what { color: var(--muted); }
    .what { flex: 1; }
    .how { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .how:empty { display: none; }
    /* A run: the box sits at the top, intervals line up in two columns under the name. */
    .item.long { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
    .item.long .box { margin-top: -1px; }
    .run { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; margin-top: 6px; font-size: 15px; line-height: 1.6; }
    .run span { color: var(--muted); }
    .run b { text-align: right; }
    .said { font-size: 20px; font-weight: 600; min-height: 30px; }
    .past { display: flex; justify-content: space-between; align-items: baseline; }
    .past button { min-height: 0; padding: 0; border: 0; color: var(--blue); }

    button {
      font: inherit; color: inherit; background: none;
      border: 1px solid var(--fg); border-radius: 6px;
      min-height: 56px; padding: 0 16px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: 16px; }

    /* Demo mode (?demo): step through days */
    .demo { display: flex; align-items: center; gap: 8px; color: var(--fg); }
    .demo button { min-height: 36px; padding: 0 12px; font-size: 15px; }
    .demo button:disabled { opacity: 0.3; }

    @media (max-height: 700px) {
      .grid { margin-top: 12px; }
      .item { min-height: 46px; padding: 6px 12px; }
      .run { font-size: 14px; line-height: 1.4; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { totals, workout, howMuch, allDates, streaks, counted, today, label, diffDays, addDays, FIRST, LAST, START } from './plan.js';

    // Demo mode: open with ?demo to step through the block day by day.
    // It keeps its own ticks, so it never touches the real log.
    const DEMO = new URLSearchParams(location.search).has('demo');
    let demoDay = START;

    // The day on screen. null means today; tap a past square in the grid to open that day instead.
    let viewing = null;

    // { 'YYYY-MM-DD': [true/false per item, in order] }
    const KEY = DEMO ? 'ritch-demo-ticks' : 'ritch-ticks';
    const root = document.getElementById('app');

    function currentDay() {
      return DEMO ? demoDay : today();
    }

    function loadLog() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
    }

    function saveLog(log) {
      try { localStorage.setItem(KEY, JSON.stringify(log)); } catch {}
      navigator.storage?.persist?.().catch(() => {});
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function shownDay() {
      return viewing ?? currentDay();
    }

    // Days you can open from the grid: the block so far, up to today.
    function canOpen(date, t) {
      return date >= START && date <= t;
    }

    function cellClass(date, t, log) {
      if (counted(date, log)) return 'done';
      if (date < START) return '';
      if (date === t) return 'today';
      if (date < t) return 'miss';
      return '';
    }

    function itemHtml(item, i, on) {
      const run = item.lines
        ? `<span class="run">${item.lines.map(([what, how]) => `<span>${esc(what)}</span><b>${esc(how)}</b>`).join('')}</span>`
        : '';
      return `<button class="item ${on ? 'on' : ''} ${item.lines ? 'long' : ''}" data-tick="${i}">
        <span class="box"></span>
        <span class="what">${esc(item.name)}${run}</span>
        <span class="how">${esc(howMuch(item))}</span>
      </button>`;
    }

    function demoNav(t) {
      return `<span class="demo">
        <button data-step="-1" ${t <= FIRST ? 'disabled' : ''}>‹</button>
        <span>${esc(label(t))}</span>
        <button data-step="1" ${t >= LAST ? 'disabled' : ''}>›</button>
        <button data-reset>Reset</button>
      </span>`;
    }

    function render() {
      const t = currentDay();
      const log = loadLog();
      const dates = allDates();
      const shown = shownDay();
      const w = workout(shown, log);
      const checks = log[shown] || [];
      const count = dates.filter((d) => counted(d, log)).length;
      const run = streaks(log, t);
      const done = totals(log, shown);
      const tally = [[done.run, 'cardio'], [done.pull, 'pull-ups'], [done.dip, 'dips'], [done.push, 'push-ups']];
      const dayIndex = Math.min(dates.length, Math.max(0, diffDays(FIRST, t) + 1));

      let now = '<h1>33</h1>';
      if (t < START) {
        now = `<h1>Starts ${esc(label(START))}</h1>`;
      } else if (w) {
        const said = counted(shown, log) ? 'You did all. Day counted.' : w.note ? `<span class="muted">${esc(w.note)}</span>` : '';
        const past = viewing
          ? `<p class="past muted"><span>${esc(label(shown))}</span><button data-back>Back to today</button></p>`
          : '';
        now = `${past}<h1>${esc(w.title)}</h1>
          <div class="list">${w.items.map((item, i) => itemHtml(item, i, checks[i])).join('')}</div>
          <p class="said">${said}</p>`;
      }

      root.innerHTML = `
        <p class="head"><span>Day <b>${dayIndex}</b> of ${dates.length}</span><span><b>${count}</b> done</span></p>
        <div class="grid" aria-label="Oct 19 to Jan 8">${dates.map((d) => `<i class="c ${cellClass(d, t, log)} ${d === viewing ? 'view' : ''}" title="${label(d)}" ${canOpen(d, t) ? `data-day="${d}"` : ''}></i>`).join('')}</div>
        <p class="goals muted" aria-label="Done through ${esc(label(shown))}">${tally.map(([n, what]) => `<span><b>${n.toLocaleString('en-US')}</b>${esc(what)}</span>`).join('')}</p>
        <section class="now">${now}</section>
        <p class="foot muted"><span>${count ? `Streak <b>${run.current}</b> · longest <b>${run.longest}</b>` : '&nbsp;'}</span>${DEMO ? demoNav(t) : ''}</p>
      `;
    }

    // Tap a row to tick it; tap again to untick.
    root.addEventListener('click', (e) => {
      if (DEMO && e.target.closest('[data-step]')) {
        demoDay = addDays(demoDay, Number(e.target.closest('[data-step]').dataset.step));
        viewing = null;
        render();
        return;
      }
      if (DEMO && e.target.closest('[data-reset]')) {
        saveLog({});
        demoDay = START;
        viewing = null;
        render();
        return;
      }
      // Tap a past square to open that day; tap today's square (or "Back to today") to return.
      const cell = e.target.closest('[data-day]');
      if (cell || e.target.closest('[data-back]')) {
        const day = cell?.dataset.day;
        viewing = day && day !== currentDay() ? day : null;
        render();
        return;
      }
      const row = e.target.closest('[data-tick]');
      if (!row) return;
      const t = shownDay();
      const log = loadLog();
      const checks = log[t] || [];
      const i = Number(row.dataset.tick);
      checks[i] = !checks[i];
      log[t] = checks;
      saveLog(log);
      render();
    });

    render();
    // Reopened the next day: the date moved on, redraw.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (viewing && viewing >= currentDay()) viewing = null;
      render();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
