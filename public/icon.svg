<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Race-car number 33: blue livery, white and red stripes, white number roundel -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <!-- A block racing "3" as one outline, so the stroke has no seams -->
    <path id="three" d="M0,0 H112 V200 H0 V162 H74 V119 H26 V81 H74 V38 H0 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0b2a6f"/>
    <g transform="rotate(-45 256 256)">
      <rect x="-200" y="186" width="912" height="62" fill="#ffffff"/>
      <rect x="-200" y="262" width="912" height="62" fill="#c8102e"/>
    </g>
    <circle cx="256" cy="256" r="184" fill="#ffffff" stroke="#0b2a6f" stroke-width="14"/>
    <circle cx="256" cy="256" r="166" fill="none" stroke="#c8102e" stroke-width="8"/>
    <g transform="translate(256 256) skewX(-12) translate(-122 -100)" fill="#c8102e" stroke="#0b2a6f" stroke-width="12" stroke-linejoin="miter" paint-order="stroke">
      <use href="#three"/>
      <use href="#three" x="132"/>
    </g>
  </g>
</svg>
